<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KaamKaro - Local Jobs</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 6px;
      color: #d1d5db;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .search {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 16px;
    }

    .job {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .job h2 {
      margin-bottom: 8px;
    }

    .job p {
      margin: 6px 0;
      color: #555;
    }

    .payment {
      font-weight: bold;
      margin-top: 10px;
    }

    button {
      margin-top: 12px;
      padding: 11px 18px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      cursor: pointer;
    }

    #jobs {
      margin-top: 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>🚀 KaamKaro</h1>
  <p>Students ke liye local paid work</p>
</header>

<div class="container">

  <input
    class="search"
    id="search"
    type="text"
    placeholder="Job search karo..."
  >

  <div id="jobs">
    <p>Jobs load ho rahi hain...</p>
  </div>

</div>

<script>
  const SUPABASE_URL = "https://ibifvrxgdwbtjqazwlud.supabase.co";
  const SUPABASE_KEY = "sb_publishable_LqGbZ0Vv0B6dCeeGk1b9Hg_zQHzXnU9";

  async function loadJobs() {
    try {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/Kaam%20Karo?select=*`,
        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
          }
        }
      );
       if (!response.ok) {
  const errorText = await response.text();
  document.getElementById("jobs").innerHTML =
    "<p>Supabase Error: " + errorText + "</p>";
  return;
       }
      const jobs = await response.json();

      const jobsDiv = document.getElementById("jobs");

      if (!jobs.length) {
        jobsDiv.innerHTML = "<p>Abhi koi job available nahi hai.</p>";
        return;
      }

      jobsDiv.innerHTML = jobs.map(job => `
        <div class="job">
          <h2>${job.title || "Job"}</h2>
          <p>${job.description || ""}</p>
          <p>📍 ${job.location || "Location available nahi"}</p>
          <p class="payment">💰 ₹${job.payment || 0}</p>
           <button onclick="applyJob(${job.id})">Apply Now</button>
        </div>
      `).join("");

    } catch (error) {
      document.getElementById("jobs").innerHTML =
        "<p>Jobs load nahi ho paayi.</p>";
    }
  }

  loadJobs();
  async function applyJob(jobId) {
  const name = prompt("Apna naam likho:");
  if (!name) return;

  const phone = prompt("Apna mobile number likho:");
  if (!phone) return;

  try {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/applications`,
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },
        body: JSON.stringify({
          job_id: jobId,
          student_id: crypto.randomUUID(),
          name: name,
          phone: phone
        })
      }
    );

    if (response.ok) {
      alert("Application successfully submit ho gayi! 🎉");
    } else {
    const errorText = await response.text();
alert("Error: " + errorText);
    }
  } catch (error) {
    alert("Kuch error aa gaya.");
  }
  }
</script>

</body>
</html>
